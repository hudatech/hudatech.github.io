    <script>
      // Set theme before first paint to avoid a light/dark flash.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
