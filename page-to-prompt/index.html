<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page to Prompt – Turn any web page into a ready-to-use AI prompt</title>
    <link rel="icon" type="image/png" href="@/assets/page-to-prompt/favicon.png" />
    <meta
      name="description"
      content="Page to Prompt is a Chrome extension that sends highlighted text, page content, URL or title to Claude, ChatGPT, Grok, Gemini, Perplexity, Copilot or Qwen with your own saved prompts. $5.99 per month."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500..700&family=Manrope:wght@400..700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set theme before first paint to avoid a light/dark flash.
      // Saved value is 'light', 'dark' or 'auto' (missing = auto, follow the OS).
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
